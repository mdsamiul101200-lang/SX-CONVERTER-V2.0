services:
  sx-converter:
    build: .
    ports: ["8080:8080"]
    environment:
      PORT: 8080
      API_BASE_URL: http://localhost:8080
      MAX_FILE_SIZE_MB: 100
      JOB_TTL_HOURS: 6
      CORS_ORIGIN: "*"
    volumes:
      - sx_uploads:/app/data/uploads
      - sx_work:/app/data/work
      - sx_outputs:/app/data/outputs
    restart: unless-stopped
    init: true
volumes: {sx_uploads: {}, sx_work: {}, sx_outputs: {}}